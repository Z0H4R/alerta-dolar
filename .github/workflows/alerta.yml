name: Alerta Dolar

on:
  schedule:
    # Corre cada 5 minutos. GitHub no garantiza exactitud perfecta en
    # horarios de alta demanda (puede atrasarse unos minutos), pero para
    # una alerta de precio es más que suficiente.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # permite ejecutarlo manualmente con el botón "Run workflow"

permissions:
  contents: write  # necesario para que el workflow pueda subir estado.txt actualizado

jobs:
  chequear-dolar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar el chequeo del dólar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerta_dolar_actions.py

      - name: Guardar el estado actualizado en el repositorio
        run: |
          git config --global user.name "alerta-dolar-bot"
          git config --global user.email "actions@github.com"
          git add estado.txt
          git diff --staged --quiet || git commit -m "Actualiza estado del dolar"
          git push
